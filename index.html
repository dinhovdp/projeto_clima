<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Consulta de Clima</title>

    <link
        rel="stylesheet"
        href="/assets/css/style.css"
    >

</head>


<body>

    <!-- =====================================================
         CONTROLE DE TEMA
         ===================================================== -->

    <div class="theme-container">

        <button
            id="theme-toggle"
            type="button"
        >
            🌙 Modo escuro
        </button>

    </div>


    <!-- =====================================================
         CONTAINER PRINCIPAL
         ===================================================== -->

    <main class="container">

        <h1>
            Clima Atual
        </h1>


        <!-- =================================================
             FORMULÁRIO DE PESQUISA
             ================================================= -->

        <form
            id="weather-form"
        >

            <input
                type="text"
                id="city-input"
                placeholder="Digite o nome da cidade..."
                autocomplete="off"
                required
            >


            <button
                type="submit"
            >
                Buscar
            </button>

        </form>


        <!-- =================================================
             CARREGAMENTO
             ================================================= -->

        <p
            id="loading"
            class="hidden"
        >
            Buscando informações do clima...
        </p>


        <!-- =================================================
             MENSAGEM DE ERRO
             ================================================= -->

        <p
            id="error-message"
            class="hidden erro"
        ></p>


        <!-- =================================================
             RESULTADO DO CLIMA
             ================================================= -->

        <section
            id="weather-result"
            class="hidden"
        >

            <!-- =============================================
                 CIDADE
                 ============================================= -->

            <h2
                id="city-name"
            ></h2>


            <!-- =============================================
                 HORÁRIO LOCAL DA CIDADE
                 ============================================= -->

            <p
                id="local-time"
            ></p>


            <!-- =============================================
                 ÍCONE / DESCRIÇÃO
                 ============================================= -->

            <p
                id="weather-description"
            ></p>


            <!-- =============================================
                 TEMPERATURA
                 ============================================= -->

            <p
                id="temperature"
            ></p>


            <!-- =============================================
                 INFORMAÇÕES COMPLEMENTARES
                 ============================================= -->

            <div
                class="weather-details"
            >

                <!-- =========================================
                     SENSAÇÃO TÉRMICA
                     ========================================= -->

                <div
                    class="weather-detail"
                >

                    <span>
                        🌡️
                    </span>

                    <p
                        id="feels-like"
                    >
                        Sensação térmica: --
                    </p>

                </div>


                <!-- =========================================
                     UMIDADE
                     ========================================= -->

                <div
                    class="weather-detail"
                >

                    <span>
                        💧
                    </span>

                    <p
                        id="humidity"
                    >
                        Umidade: --
                    </p>

                </div>


                <!-- =========================================
                     VENTO
                     ========================================= -->

                <div
                    class="weather-detail"
                >

                    <span>
                        💨
                    </span>

                    <p
                        id="wind"
                    >
                        Vento: --
                    </p>

                </div>

            </div>


            <!-- =============================================
                 ATUALIZAÇÃO
                 ============================================= -->

            <p
                id="updated-at"
            ></p>


            <!-- =============================================
                 BOTÃO DE COMPARAÇÃO
                 ============================================= -->

            <div
                class="comparison-action"
            >

                <button
                    id="add-comparison"
                    type="button"
                >
                    ➕ Adicionar à comparação
                </button>

            </div>


            <!-- =============================================
                 PREVISÃO DE 7 DIAS
                 ============================================= -->

            <section
                id="forecast-section"
                class="forecast-section hidden"
            >

                <div
                    class="forecast-header"
                >

                    <h2>
                        Previsão para os próximos 7 dias
                    </h2>

                </div>


                <div
                    id="forecast-container"
                    class="forecast-container"
                >

                    <!--
                        Os cards são criados
                        dinamicamente pelo
                        forecast.js.
                    -->

                </div>

            </section>


            <!-- =============================================
                 COMPARAÇÃO DE CIDADES
                 ============================================= -->

            <section
                id="comparison-section"
                class="comparison-section hidden"
            >

                <div
                    class="comparison-header"
                >

                    <h2>
                        Comparação de cidades
                    </h2>

                    <p>
                        Compare até 5 cidades
                    </p>

                </div>


                <div
                    id="comparison-container"
                    class="comparison-container"
                >

                    <!--
                        Os mini cards serão
                        criados pelo
                        comparison.js.
                    -->

                </div>

            </section>

        </section>

    </main>


    <!-- =====================================================
         NOTIFICAÇÃO
         ===================================================== -->

    <div
        id="weather-toast"
        class="weather-toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="/assets/js/api.js"
    ></script>


    <script
        src="/assets/js/forecast.js"
    ></script>


    <script
        src="/assets/js/comparison.js"
    ></script>


</body>

</html>
